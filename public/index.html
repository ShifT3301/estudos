<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudos</title>
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #667085; --line: #e4e7ec;
  --accent: #0f766e; --accent-soft: #ccfbef; --cards: #7c3aed; --cards-soft: #ede9fe;
  --warn: #b45309; --warn-soft: #fef3c7; --danger: #b42318;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --card: #171b22; --text: #e6e8eb; --muted: #98a2b3; --line: #2a303a;
    --accent: #2dd4bf; --accent-soft: #123b37; --cards: #a78bfa; --cards-soft: #2a2244;
    --warn: #fbbf24; --warn-soft: #3a2e10; --danger: #f97066; --shadow: none;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: env(safe-area-inset-bottom); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.bar h1 { font-size: 18px; margin: 0; flex: 1; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.ok .dot { background: var(--accent); } .sync.syncing .dot { background: var(--warn); }
.sync.error .dot { background: var(--danger); } .sync.error { color: var(--danger); }
.tabs { max-width: 760px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 0 10px; color: var(--muted); font-weight: 600; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn-soft); color: var(--warn); font-size: 11px; line-height: 18px; margin-left: 4px; }

main { max-width: 760px; margin: 0 auto; padding: 16px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 8px; }
h2:first-child { margin-top: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; }
.card.click { cursor: pointer; } .card.click:hover { border-color: var(--accent); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.title { font-weight: 650; font-size: 16px; overflow-wrap: anywhere; }
.muted { color: var(--muted); font-size: 13px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.gray { background: var(--line); color: var(--muted); }
.pace { font-size: 22px; font-weight: 700; color: var(--accent); }

.bars { display: grid; gap: 6px; margin-top: 10px; }
.barline { display: grid; grid-template-columns: 78px 1fr 42px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .25s; }
.fill.cards { background: var(--cards); }
.barline b { text-align: right; color: var(--text); font-weight: 600; }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 12px; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #062420; } }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: none; }
input[type=text], input[type=url], input[type=date], input[type=password], textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px;
}
textarea { resize: vertical; min-height: 70px; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
label.f, div.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.datebox { position: relative; display: flex; gap: 8px; }
.datebox input[type=text] { flex: 1; min-width: 0; }
.datebox input.bad { outline: 2px solid var(--danger); outline-offset: -1px; }
.datepick { position: absolute; right: 0; bottom: 0; width: 44px; height: 100%; opacity: 0; pointer-events: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

ul.lessons { list-style: none; margin: 0; padding: 0; }
.lesson { border-top: 1px solid var(--line); padding: 10px 0; }
.lesson:first-child { border-top: 0; }
.lesson .lt { flex: 1; min-width: 140px; overflow-wrap: anywhere; }
.lesson.done .lt { color: var(--muted); }
@media (max-width: 520px) { .lesson .lt { flex-basis: 100%; } }
.tog { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.tog.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tog.cards.on { background: var(--cards-soft); border-color: var(--cards); color: var(--cards); }
.tog.q.pending { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.lmeta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font-size: 12px; font-weight: 600; }
.expand { margin-top: 10px; display: grid; gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.quick { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
.quick input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.seg button { border: 0; background: none; padding: 6px 14px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.doubt { white-space: pre-wrap; margin: 6px 0 8px; }

dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); color: var(--text); width: min(520px, calc(100vw - 32px)); padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog h3 { margin: 0 0 10px; }
dialog p { margin: 6px 0 12px; }
.stack { display: grid; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>📚 Estudos</h1>
    <span id="sync" class="sync" data-act="settings" style="cursor:pointer"><span class="dot"></span><span id="syncText">Só neste aparelho</span></span>
    <button class="btn ghost small" data-act="settings" aria-label="Configurações">⚙️</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>

<dialog id="settings">
  <h3>Conta e backup</h3>
  <div class="stack">
    <div id="authOut" class="stack">
      <p class="muted">Entre para guardar seu progresso na nuvem e abrir em qualquer aparelho. Sem conta, os dados ficam só neste aparelho.</p>
      <div class="seg" style="margin-bottom:0">
        <button data-act="auth-mode" data-m="login" id="mLogin" class="on">Entrar</button>
        <button data-act="auth-mode" data-m="register" id="mRegister">Criar conta</button>
      </div>
      <label class="f">Usuário
        <input type="text" id="authUser" autocomplete="username" autocapitalize="none" spellcheck="false">
      </label>
      <label class="f">Senha
        <input type="password" id="authPass" autocomplete="current-password">
      </label>
      <label class="f" id="inviteRow" hidden>Código de convite
        <input type="text" id="authInvite" autocomplete="off" autocapitalize="none" spellcheck="false">
      </label>
      <div><button class="btn primary" data-act="auth-submit" id="authSubmit">Entrar</button></div>
      <p class="muted" id="authMsg" role="status"></p>
    </div>
    <div id="authIn" class="stack" hidden>
      <p>Conectado como <b id="whoami"></b>.</p>
      <div class="row">
        <button class="btn" data-act="sync-now">Sincronizar agora</button>
        <button class="btn danger" data-act="logout">Sair</button>
      </div>
      <p class="muted" id="syncDetail"></p>
    </div>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <div class="row">
      <button class="btn" data-act="export">Exportar backup</button>
      <button class="btn" data-act="import">Importar backup</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="close-settings">Fechar</button></div>
  </div>
</dialog>
<div class="toast" id="toast"></div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
